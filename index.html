<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웨딩 사진 레퍼런스 갤러리</title>
    <!-- Tailwind CSS Load -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Load (우아한 웨딩 느낌을 위한 명조체 및 고딕체 혼합) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #faf9f8; /* 웨딩 느낌의 부드러운 웜톤 배경 */
        }
        h1, h2 {
            font-family: 'Noto Serif KR', serif;
        }
        /* 그리드 반응형 (최소 250px 크기의 바둑판 배열) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        /* 이미지 비율 유지 및 크롭 */
        .img-container {
            position: relative;
            overflow: hidden;
            padding-top: 125%; /* 4:5 세로형 비율 (웨딩 사진에 적합) */
            border-radius: 0.5rem;
        }
        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        /* 호버 효과 */
        .img-container:hover img {
            transform: scale(1.05);
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Header -->
    <header class="py-12 text-center bg-white shadow-sm mb-10">
        <h1 class="text-4xl md:text-5xl font-semibold text-gray-900 tracking-tight">Wedding Photo References</h1>
        <p class="mt-4 text-gray-500 font-light text-lg">원하시는 사진을 클릭하여 확대해 보세요</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-20">

        <!-- Category 1 -->
        <section class="mb-16">
            <div class="border-b border-gray-200 pb-4 mb-8">
                <h2 class="text-2xl md:text-3xl font-semibold text-gray-800">1. CN 스튜디오 레퍼런스 이미지</h2>
            </div>
            
            <div class="gallery-grid">
                <!-- CN Studio Image 1 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/CN%EC%8A%A4%ED%8A%9C%EB%94%94%EC%98%A4%20(1).jpg?raw=true" alt="CN Studio Ref 1" class="gallery-img" loading="lazy">
                </div>
                <!-- CN Studio Image 2 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/CN%EC%8A%A4%ED%8A%9C%EB%94%94%EC%98%A4%20(2).jpg?raw=true" alt="CN Studio Ref 2" class="gallery-img" loading="lazy">
                </div>
                <!-- CN Studio Image 3 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/CN%EC%8A%A4%ED%8A%9C%EB%94%94%EC%98%A4%20(3).jpg?raw=true" alt="CN Studio Ref 3" class="gallery-img" loading="lazy">
                </div>
                <!-- CN Studio Image 4 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/CN%EC%8A%A4%ED%8A%9C%EB%94%94%EC%98%A4%20(4).jpg?raw=true" alt="CN Studio Ref 4" class="gallery-img" loading="lazy">
                </div>
                <!-- CN Studio Image 5 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/CN%EC%8A%A4%ED%8A%9C%EB%94%94%EC%98%A4%20(5).jpg?raw=true" alt="CN Studio Ref 5" class="gallery-img" loading="lazy">
                </div>
            </div>
        </section>

        <!-- Category 2 -->
        <section>
            <div class="border-b border-gray-200 pb-4 mb-8">
                <h2 class="text-2xl md:text-3xl font-semibold text-gray-800">2. 기타 인스타그램 레퍼런스</h2>
            </div>
            
            <div class="gallery-grid">
                <!-- Insta Image 1 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/%EA%B8%B0%ED%83%80%20%EB%A0%88%ED%8D%BC%EB%9F%B0%EC%8A%A4%20(1).jpg?raw=true" alt="Instagram Ref 1" class="gallery-img" loading="lazy">
                </div>
                <!-- Insta Image 2 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/%EA%B8%B0%ED%83%80%20%EB%A0%88%ED%8D%BC%EB%9F%B0%EC%8A%A4%20(2).jpg?raw=true" alt="Instagram Ref 2" class="gallery-img" loading="lazy">
                </div>
                <!-- Insta Image 3 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/%EA%B8%B0%ED%83%80%20%EB%A0%88%ED%8D%BC%EB%9F%B0%EC%8A%A4%20(3).jpg?raw=true" alt="Instagram Ref 3" class="gallery-img" loading="lazy">
                </div>
                <!-- Insta Image 4 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://github.com/ADplanters/public/blob/main/%EA%B8%B0%ED%83%80%20%EB%A0%88%ED%8D%BC%EB%9F%B0%EC%8A%A4%20(4).jpg?raw=true" alt="Instagram Ref 4" class="gallery-img" loading="lazy">
                </div>
                <!-- Insta Image 5 -->
                <div class="img-container shadow-sm hover:shadow-xl cursor-pointer">
                    <img src="https://rawcdn.githack.com/ADplanters/public/ae277449ce9797718544296069a81a3050c32280/%EA%B8%B0%ED%83%80%20%EB%A0%88%ED%8D%BC%EB%9F%B0%EC%8A%A4%20(5).jpg?raw=true" alt="Instagram Ref 5" class="gallery-img" loading="lazy">
                </div>
            </div>
        </section>

    </main>

    <!-- Modal for Full Screen Image -->
    <div id="imageModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 hidden opacity-0 transition-opacity duration-300">
        <!-- Close Button -->
        <button id="closeModalBtn" class="absolute top-6 right-6 md:top-10 md:right-10 text-white hover:text-gray-300 focus:outline-none z-50 p-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 md:h-12 md:w-12 drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        
        <!-- Enlarged Image -->
        <div class="w-full h-full p-4 md:p-12 flex items-center justify-center cursor-pointer" id="modalOverlay">
            <img id="modalImage" src="" alt="Enlarged Reference" class="max-w-full max-h-full rounded-md shadow-2xl object-contain cursor-default select-none">
        </div>
    </div>

    <!-- JavaScript for Modal Interaction -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const closeBtn = document.getElementById('closeModalBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const galleryImages = document.querySelectorAll('.gallery-img');

            // Open Modal
            galleryImages.forEach(img => {
                img.addEventListener('click', (e) => {
                    modalImg.src = e.target.src; // 클릭한 이미지의 주소를 모달 이미지에 전달
                    modal.classList.remove('hidden');
                    // 약간의 딜레이를 주어 transition(opacity) 효과가 적용되게 함
                    requestAnimationFrame(() => {
                        modal.classList.remove('opacity-0');
                    });
                    document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
                });
            });

            // Close Modal Function
            const closeModal = () => {
                modal.classList.add('opacity-0');
                // transition 시간(300ms) 이후에 hidden 클래스 추가
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modalImg.src = ''; // 리소스 해제
                    document.body.style.overflow = ''; // 배경 스크롤 복구
                }, 300);
            };

            // Close Events
            closeBtn.addEventListener('click', closeModal);
            
            // 이미지 밖(배경) 클릭 시 닫기
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            // ESC 키 누를 때 닫기
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
